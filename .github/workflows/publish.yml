name: Publish LamGC Playwright MCP

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to publish (for example 0.0.80)
        required: true
      tag:
        description: npm dist-tag
        required: true
        default: next
        type: choice
        options: [next, latest]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@latest
      - run: npm ci
      - name: Set release version
        run: |
          if [ "$(node -p "require('./package.json').version")" != "${{ inputs.version }}" ]; then
            npm version ${{ inputs.version }} --no-git-tag-version
          fi
          node -e "const fs=require('fs'); const server=require('./server.json'); server.version=require('./package.json').version; server.packages.forEach(p => p.version=server.version); fs.writeFileSync('server.json', JSON.stringify(server, null, 2) + '\n');"
      - run: npm run lint
      - run: npm run ctest
      - run: npm publish --access public --tag ${{ inputs.tag }}
