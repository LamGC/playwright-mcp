name: Publish LamGC Playwright MCP

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed in package.json and server.json (for example 0.0.81)
        required: true
      tag:
        description: npm dist-tag
        required: true
        default: next
        type: choice
        options: [next, latest]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@latest
      - run: npm ci
      - name: Verify release metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node -e "const pkg=require('./package.json'); const server=require('./server.json'); const expected=process.env.REQUESTED_VERSION; const versions=[pkg.version, server.version, ...server.packages.map(p => p.version)]; if (versions.some(version => version !== expected)) { console.error({ expected, versions }); process.exit(1); }"
      - name: Ensure npm version is unpublished
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if npm view "@lamgc/playwright-mcp@$REQUESTED_VERSION" version >/dev/null 2>&1; then
            echo "Version $REQUESTED_VERSION already exists on npm."
            exit 1
          fi
      - run: npm run lint
      - run: npm run ctest
      - run: npm publish --access public --tag ${{ inputs.tag }}
